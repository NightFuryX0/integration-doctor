name: Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Run tests
        run: pytest -q

      - name: Test installed CLI
        run: |
          integration-doctor --version
          integration-doctor integrations/safe_webhook

      - name: Run Integration Doctor
        run: |
          # FIX: Verify the safe fixture still exits successfully.
          integration-doctor integrations/safe_webhook

          # FIX: The broken fixture is intentionally unsafe, so exit code 1 is expected.
          set +e
          integration-doctor integrations/broken_webhook
          status=$?
          set -e

          # FIX: Fail CI only when the scanner returns an unexpected exit code.
          if [ "$status" -ne 1 ]; then
            echo "Expected Integration Doctor to return exit code 1 for the broken fixture, got $status"
            exit 1
          fi

      - name: Generate SARIF report
        run: |
          integration-doctor . --sarif > integration-doctor.sarif || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: integration-doctor.sarif
